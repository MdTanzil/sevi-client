<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved dark mode before the first paint: otherwise
         dark-mode users see a white flash on every reload while React is
         still loading. ThemeModeProvider keeps this in sync afterwards. -->
    <script>
      try {
        if (window.localStorage.getItem("sevi-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "#121212";
        }
      } catch (e) {}
    </script>
    <title>Sevi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
